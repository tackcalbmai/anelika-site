name: Finalize service icons

on:
  push:
    branches: [main]
    paths:
      - trigger-service-icons.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore static service cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          cards = '''        <div class="service-cards">
          <article class="service-card" data-spotlight><div class="card-icon"><img src="/icons/cleaning.svg?v=2" alt="" aria-hidden="true"></div><h3>Telpu uzkopšana</h3><p>Regulāra, ģenerālā un pēc remonta uzkopšana, kā arī logu un atsevišķu zonu tīrīšana.</p><a class="inline-link" href="/uzkopsana/">Skatīt pakalpojumu <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4" fill="none"/></svg></a></article>
          <article class="service-card" data-spotlight><div class="card-icon"><img src="/icons/territory.svg?v=2" alt="" aria-hidden="true"></div><h3>Teritoriju kopšana</h3><p>Zāles pļaušana, lapu un zaru savākšana, sezonas darbi un teritorijas uzturēšana.</p><a class="inline-link" href="/teritoriju-kopsana/">Skatīt pakalpojumu <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4" fill="none"/></svg></a></article>
          <article class="service-card" data-spotlight><div class="card-icon"><img src="/icons/repair.svg?v=2" alt="" aria-hidden="true"></div><h3>Sīki remontdarbi</h3><p>Mēbeļu montāža, nelieli apdares labojumi, silikona un blīvējumu atjaunošana, kā arī vienkārši santehnikas darbi.</p><a class="inline-link" href="/siki-remontdarbi/">Skatīt pakalpojumu <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4" fill="none"/></svg></a></article>
        </div>'''
          pattern = r'        <div class="service-cards">.*?        </div>(?=\n      </div>\n    </section>\n\n    <section class="section-tight">)'
          html, count = re.subn(pattern, cards, html, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('Service card section not found')
          html = html.replace('/footer-cookie.js?v=1', '/footer-cookie.js?v=2')
          index.write_text(html, encoding='utf-8')

          cookie = Path('footer-cookie.js')
          cookie.write_text('''(() => {
  const banner = document.querySelector('[data-cookie-banner]');
  const accept = document.querySelector('[data-cookie-accept]');
  const settings = document.querySelectorAll('[data-cookie-settings]');
  const storageKey = 'anelika_cookie_notice_v1';

  const readChoice = () => {
    try { return window.localStorage.getItem(storageKey); }
    catch (_) { return null; }
  };

  const saveChoice = () => {
    try { window.localStorage.setItem(storageKey, 'acknowledged'); }
    catch (_) { /* The notice can still be closed for this page view. */ }
  };

  const show = (focusButton = false) => {
    if (!banner) return;
    banner.hidden = false;
    if (focusButton) window.setTimeout(() => accept?.focus({ preventScroll: true }), 50);
  };

  const hide = () => {
    if (banner) banner.hidden = true;
  };

  if (banner && !readChoice()) window.setTimeout(() => show(false), 650);

  accept?.addEventListener('click', () => {
    saveChoice();
    hide();
  });

  settings.forEach(button => button.addEventListener('click', () => show(true)));

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && banner && !banner.hidden) hide();
  });
})();
''', encoding='utf-8')
          PY
      - name: Remove temporary files and commit
        run: |
          rm -f trigger-service-icons.txt
          rm -f .github/workflows/replace-service-icons.yml
          rm -f .github/workflows/finalize-service-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize polished service icons and restore static cards"
          git push
