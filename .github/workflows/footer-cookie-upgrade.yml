.footer-brand-block p{color:#a9c3d3;font-size:15px;line-height:1.7;margin-bottom:19px}.footer-call{display:inline-flex;color:#fff;font-size:19px;font-weight:900;letter-spacing:.02em;transition:color .2s}.footer-call:hover{color:var(--cyan)}
.footer-column h2{font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:#fff;margin:7px 0 19px}.footer-column nav{display:grid;gap:10px}.footer-column nav a{width:max-content;max-width:100%;color:#a9c3d3;font-size:14px;transition:color .2s,transform .2s}.footer-column nav a:hover{color:#fff;transform:translateX(3px)}
.footer-contact-list{display:grid;gap:14px}.footer-contact-list a,.footer-contact-list div{display:grid;gap:2px}.footer-contact-list span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#789db3}.footer-contact-list strong{font-size:14px;color:#d8e7ef;overflow-wrap:anywhere}.footer-contact-list a:hover strong{color:#fff}
.footer-company dl{display:grid;gap:12px;margin:0}.footer-company dl div{display:grid;gap:2px}.footer-company dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#789db3}.footer-company dd{margin:0;color:#d8e7ef;font-size:13px;line-height:1.55}
.footer-bottom{position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 0 26px;border-top:1px solid rgba(255,255,255,.10);color:#85a7bb;font-size:12px}.footer-legal{display:flex;align-items:center;gap:18px}.footer-legal a,.footer-legal button{padding:0;border:0;background:none;color:#a9c3d3;font-size:12px;cursor:pointer}.footer-legal a:hover,.footer-legal button:hover{color:#fff}
.cookie-banner[hidden]{display:none}.cookie-banner{position:fixed;left:50%;bottom:22px;z-index:1200;width:min(760px,calc(100% - 36px));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:18px 19px;border:1px solid rgba(255,255,255,.18);border-radius:22px;color:#fff;background:rgba(5,30,56,.96);box-shadow:0 24px 70px rgba(1,18,37,.36);backdrop-filter:blur(20px);transform:translateX(-50%);animation:cookie-in .35s ease both}
.cookie-symbol{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:rgba(103,216,242,.12);border:1px solid rgba(103,216,242,.18)}.cookie-symbol svg{width:30px;height:30px;fill:none;stroke:#82e2f5;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cookie-copy strong{display:block;font-size:16px;margin-bottom:3px}.cookie-copy p{margin:0 0 4px;color:#b9cfdd;font-size:13px;line-height:1.5}.cookie-copy a{color:#8de3f5;font-size:12px;font-weight:800}.cookie-copy a:hover{text-decoration:underline}.cookie-accept{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:#fff;color:var(--navy);font-weight:900;cursor:pointer;transition:transform .2s,background .2s}.cookie-accept:hover{transform:translateY(-2px);background:#e9f8fc}
@keyframes cookie-in{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
