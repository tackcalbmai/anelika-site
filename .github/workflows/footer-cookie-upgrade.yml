          if 'anelika_cookie_notice_v1' not in js:
              insert = r'''

  /* Informational cookie notice: no analytics or advertising cookies are loaded. */
  const cookieBanner = document.querySelector('[data-cookie-banner]');
  const cookieAccept = document.querySelector('[data-cookie-accept]');
  const cookieSettings = document.querySelectorAll('[data-cookie-settings]');
  const cookieStorageKey = 'anelika_cookie_notice_v1';

  const readCookieNotice = () => {
    try { return window.localStorage.getItem(cookieStorageKey); }
    catch (_) { return null; }
  };

  const writeCookieNotice = value => {
    try { window.localStorage.setItem(cookieStorageKey, value); }
    catch (_) { /* The banner can still be closed for the current page view. */ }
  };

  const showCookieNotice = () => {
    if (!cookieBanner) return;
    cookieBanner.hidden = false;
    window.setTimeout(() => cookieAccept?.focus({ preventScroll: true }), 80);
  };

  const hideCookieNotice = () => {
    if (cookieBanner) cookieBanner.hidden = true;
  };

  if (cookieBanner && !readCookieNotice()) {
    window.setTimeout(showCookieNotice, reduceMotion ? 0 : 650);
  }

  cookieAccept?.addEventListener('click', () => {
    writeCookieNotice('acknowledged');
    hideCookieNotice();
  });

  cookieSettings.forEach(button => button.addEventListener('click', () => {
    showCookieNotice();
  }));
'''
