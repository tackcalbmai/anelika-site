name: Upgrade footer and privacy notice

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/footer-cookie-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build footer, privacy page and cookie notice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          footer = '''<footer class="site-footer">
