name: Publish footer and privacy upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/footer-cookie-upgrade.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply site upgrade
        run: python tools/apply_footer.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add professional footer, privacy page and cookie notice"
          git push
