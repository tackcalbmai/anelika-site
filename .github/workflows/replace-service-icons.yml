name: Repair service card icons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-service-icons.yml

permissions:
  contents: write

jobs:
  repair-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore all three service cards with image icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          cards = '''<div class="service-cards">
          <article class="service-card" data-spotlight><div class="card-icon"><img src="/icons/cleaning.svg?v=1" alt="" aria-hidden="true"></div><h3>Telpu uzkopšana</h3><p>Regulāra, ģenerālā un pēc remonta uzkopšana, kā arī logu un atsevišķu zonu tīrīšana.</p><a class="inline-link" href="/uzkopsana/">Skatīt pakalpojumu <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4" fill="none"/></svg></a></article>
          <article class="service-card" data-spotlight><div class="card-icon"><img src="/icons/territory.svg?v=1" alt="" aria-hidden="true"></div><h3>Teritoriju kopšana</h3><p>Zāles pļaušana, lapu un zaru savākšana, sezonas darbi un teritorijas uzturēšana.</p><a class="inline-link" href="/teritoriju-kopsana/">Skatīt pakalpojumu <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4" fill="none"/></svg></a></article>
          <article class="service-card" data-spotlight><div class="card-icon"><img src="/icons/repair.svg?v=1" alt="" aria-hidden="true"></div><h3>Sīki remontdarbi</h3><p>Mēbeļu montāža, nelieli apdares labojumi, silikona un blīvējumu atjaunošana, kā arī vienkārši santehnikas darbi.</p><a class="inline-link" href="/siki-remontdarbi/">Skatīt pakalpojumu <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4" fill="none"/></svg></a></article>
        </div>'''
          pattern = r'<div class="service-cards">.*?</div>\s*</div>\s*</section>'
          replacement = cards + '\n      </div>\n    </section>'
          html, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('Could not restore service card section')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore all service cards with polished image icons"
          git push
