name: Update brand subtitle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-brand-subtitle.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update subtitle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'Uzkopšana un īpašuma darbi'
          new = 'Uzkopšanas serviss'
          if old not in text:
              raise SystemExit('Subtitle text not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update brand subtitle'
          git push
