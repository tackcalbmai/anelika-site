name: One-time Latvian copy cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add one-time Latvian copy cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Latvian wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('Sīki remontdarbi', 'Sīkie remontdarbi'),
              ('sīki remontdarbi', 'sīkie remontdarbi'),
              ('Pēc iepriekšējas vienošanās un atbilstoši laikapstākļiem.', 'Atbilstoši laikapstākļiem.'),
              ('Pēc atsevišķas vienošanās.', ''),
              ('Pēc iepriekšējas vienošanās.', ''),
              ('Pēc vienošanās.', ''),
              (' pēc atsevišķas vienošanās', ''),
              (' pēc iepriekšējas vienošanās', ''),
              (' pēc vienošanās', ''),
          ]

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(item)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Simplify Latvian service wording"
          git push
