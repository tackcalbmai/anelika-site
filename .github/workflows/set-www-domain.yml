name: Set www as primary domain

on:
  push:
    paths:
      - '.github/workflows/set-www-domain.yml'

permissions:
  contents: write

jobs:
  update-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update primary domain references
        run: |
          printf 'www.anelika.lv\n' > CNAME
          sed -i 's#https://anelika\.lv/#https://www.anelika.lv/#g' index.html robots.txt sitemap.xml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CNAME index.html robots.txt sitemap.xml
          git diff --cached --quiet || git commit -m 'Use www.anelika.lv as primary domain'
          git push
